<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aya's Friend</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background: #f0f8ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        /* The Visual Feedback */
        #avatar { width: 200px; height: 200px; border-radius: 50%; background: #ffcf00; margin-bottom: 20px; transition: transform 0.3s; }
        .speaking { animation: pulse 1s infinite; }

        /* Big Voice Button */
        #micBtn { width: 150px; height: 150px; border-radius: 50%; border: none; background: #4CAF50; color: white; font-size: 50px; cursor: pointer; box-shadow: 0 10px #2e7d32; }
        #micBtn:active { box-shadow: 0 5px #2e7d32; transform: translateY(4px); }
        #micBtn.listening { background: #f44336; box-shadow: 0 10px #c62828; }

        /* Aya's Text Input */
        #textInput { margin-top: 30px; padding: 15px; width: 300px; border-radius: 25px; border: 2px solid #4CAF50; font-size: 18px; outline: none; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="avatar"></div>
    <button id="micBtn">🎤</button>
    <input type="text" id="textInput" placeholder="Type to Aya's friend here...">

    <script src="app.js"></script>
</body>
</html>
